spring.application.name=proxy-server
server.port=8081

redis.host=localhost
redis.port=6379
redis.database=0

redis.connection.timeout=2000

redis.max.idle=10
redis.min.idle=2
redis.maxTotal=50

redis.pool.max.wait=3000
redis.pool.min.evictable.millis=60000

min.evictable.idle.duration=300000

spring.profiles.active=staging

